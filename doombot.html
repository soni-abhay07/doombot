<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>doombot</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b0a;--surface:#0f1816;--ink:#e3ece7;--muted:#86998f;--line:#2c3d37;--accent:#46d686;--on-accent:#04110a;--bot:#131f1b;--steel:#aebbb5;--bar:#46d686;--metal:linear-gradient(180deg,#eef4f1 0%,#a3b1ab 38%,#56645e 56%,#b9c6c0 100%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),radial-gradient(120% 70% at 50% 0%,#12382a 0%,var(--bg) 62%);color:var(--ink);font:500 15px/1.6 "Chakra Petch","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;display:flex;flex-direction:column;width:100%;max-width:760px;height:100%}
header{position:relative;display:flex;align-items:center;gap:14px;padding:14px 18px 20px;background:rgba(5,9,8,.72);backdrop-filter:blur(6px)}
.helm{width:46px;height:46px;color:var(--accent);flex:none;filter:drop-shadow(0 0 8px rgba(61,220,132,.5));transition:filter .3s}
.busy .helm{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 20px rgba(61,220,132,.95))}}
.title{flex:1;min-width:0}
h1{font:900 26px/1 Orbitron,"Arial Black",sans-serif;margin:0;letter-spacing:4px;display:inline-block;transform:skewX(-8deg);background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #1c3a2b) drop-shadow(0 0 14px rgba(70,214,134,.45))}
.meter{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--muted)}
.track{flex:1;max-width:200px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#fill{height:100%;width:4%;background:linear-gradient(90deg,#2a9c62,#7fe0a8,#eef4f1);transition:width .6s}
#reset{background:none;border:1px solid var(--line);color:var(--steel);border-radius:4px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
#reset:hover{border-color:var(--accent);color:var(--accent)}
#log{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:flex-end;animation:rise .25s ease-out}
.row.me{justify-content:flex-end}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.av{width:30px;height:30px;color:var(--accent);flex:none}
.msg{max-width:82%;padding:10px 14px;border-radius:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.me .msg{background:linear-gradient(180deg,#5fe69f,#2b9d63);color:var(--on-accent);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 10px rgba(46,214,134,.2)}
.bot .msg{background:linear-gradient(145deg,#1b2823,#101a17);border:1px solid #3a4b44;border-left:3px solid var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 10px rgba(0,0,0,.4)}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.empty{margin:auto;text-align:center;max-width:520px}
.empty .helm{width:96px;height:96px;margin-bottom:6px}
.empty h2{font:700 20px/1.35 Orbitron,"Arial Black",sans-serif;letter-spacing:1.5px;margin:0 0 8px}
.empty p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.cards button{text-align:left;background:rgba(14,21,19,.85);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px;font:inherit;font-size:14px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.cards button:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 6px 20px rgba(61,220,132,.15)}
.err{color:#ff7a5c;font-size:13px;text-align:center}
.bar{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line);background:rgba(5,9,8,.8)}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:11px 14px;font:inherit;max-height:140px}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(61,220,132,.15)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#send{background:linear-gradient(180deg,#5fe69f,#2b9d63);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);color:var(--on-accent);border:0;border-radius:4px;padding:0 22px;font:700 13px Orbitron,"Arial Black",sans-serif;letter-spacing:2px;cursor:pointer}
#send:disabled{opacity:.45;cursor:default}
header{flex-wrap:wrap}
.title{flex:1 1 150px}
.acts{display:flex;gap:8px;margin-left:auto}
.hb{background:none;border:1px solid var(--line);color:var(--steel);border-radius:4px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.hb:hover{border-color:var(--accent);color:var(--accent)}
.hb[aria-pressed="true"]{background:rgba(232,194,106,.12);border-color:#e8c26a;color:#e8c26a}
.banner{padding:8px 18px;font-size:12px;color:#e8c26a;background:rgba(232,194,106,.08);border-bottom:1px dashed rgba(232,194,106,.4)}
.temp header{border-bottom:1px dashed #e8c26a}
.temp .helm{color:#e8c26a;filter:drop-shadow(0 0 8px rgba(232,194,106,.5))}
.bar{position:relative}
#send{position:relative}
.row.me.launch .msg{animation:launch .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes launch{0%{opacity:0;transform:translateY(70px) scale(.5);filter:brightness(2)}60%{opacity:1;transform:translateY(-6px) scale(1.04)}100%{transform:none;filter:none}}
#send.fired{animation:press .25s}
@keyframes press{50%{transform:scale(.9)}}
#send.fired::after{content:"";position:absolute;inset:0;border-radius:4px;border:2px solid var(--accent);animation:ring .6s ease-out forwards}
@keyframes ring{to{transform:scale(1.7,2.1);opacity:0}}
.bar.sweep::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent) -40% 0/40% 100% no-repeat;animation:sweep .6s ease-out}
@keyframes sweep{to{background-position:140% 0}}
.fire .helm{animation:flash .55s ease-out}
@keyframes flash{40%{filter:drop-shadow(0 0 28px #3dff95) brightness(1.6);transform:scale(1.14)}}
.modes{display:flex;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.mode{background:none;border:1px solid var(--line);color:var(--steel);border-radius:999px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s}
.mode:hover{border-color:var(--accent);color:var(--accent)}
.mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.tools{display:flex;gap:6px;margin:-6px 0 0 40px;animation:rise .25s ease-out}
.tools button{background:none;border:1px solid var(--line);color:var(--steel);border-radius:4px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;transition:all .15s}
.tools button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
#glow{position:fixed;left:0;top:0;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:50%;background:radial-gradient(closest-side,rgba(61,220,132,.13),transparent);pointer-events:none;z-index:0;transform:translate(50vw,30vh)}
.helm{transform:perspective(220px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg));transition:transform .12s,filter .3s}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;border-top:2px solid var(--bar);border-bottom:1px solid var(--bar);box-shadow:0 0 8px var(--bar)}
.temp{--bar:#e8c26a}
.empty h2{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #1c3a2b)}
.hb.info{width:32px;height:32px;padding:0;border-radius:50%;font:italic 700 16px Georgia,serif}
.modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,5,.75);backdrop-filter:blur(4px)}
.modal[hidden]{display:none}
.card{position:relative;width:min(380px,100%);padding:28px 24px 24px;text-align:center;background:linear-gradient(145deg,#1b2823,#101a17);border:1px solid #3a4b44;border-top:3px solid var(--accent);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);animation:rise .25s ease-out}
.card .helm{width:64px;height:64px}
.card h3{margin:8px 0 14px;font:700 16px Orbitron,"Arial Black",sans-serif;letter-spacing:2px}
.card dl{margin:0;text-align:left}
.card dt{color:var(--muted);font-size:13px;margin-top:10px}
.card dd{margin:2px 0 0;font-size:16px;overflow-wrap:anywhere}
.card a{color:var(--accent)}
.x{position:absolute;top:10px;right:10px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--line);border-radius:50%;color:var(--steel);font-size:20px;line-height:1;padding:0;cursor:pointer}
.x:hover{color:var(--accent)}
.hb.ic{width:32px;height:32px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
@media (max-width:520px){.cards{grid-template-columns:1fr}h1{font-size:26px}.hb{padding:6px 8px}.hb.info{padding:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="helm" viewBox="0 0 64 64"><path d="M32 4 52 16V40L44 58H20L12 40V16Z" style="fill:var(--surface)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M17 29 28 34 26 38 15 34ZM47 29 36 34 38 38 49 34Z" fill="currentColor"/><path d="M26 48H38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol></svg>
<div id="glow"></div>
<div class="modal" id="about" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="ab-t"><button class="x" id="ab-x" aria-label="Close">×</button><svg class="helm"><use href="#helm"/></svg><h3 id="ab-t">Created by</h3><dl><dt>Name</dt><dd>Abhay Soni</dd><dt>Email</dt><dd><a href="mailto:abhay.s26007@nst.rishihood.edu.in">abhay.s26007@nst.rishihood.edu.in</a></dd></dl></div></div>
<canvas id="fx"></canvas>
<div class="app" id="app">
<header>
<svg class="helm"><use href="#helm"/></svg>
<div class="title"><h1>DOOMBOT</h1>
<div class="meter"><span id="lvl">Doom level: calm</span><div class="track"><div id="fill"></div></div></div></div>
<div class="acts"><button id="newchat" class="hb ic" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button><button id="temp" class="hb ic" aria-pressed="false" aria-label="Temporary chat" title="Temporary chat (not saved)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V11a7 7 0 0 1 14 0v10l-3-2-2 2-2-2-2 2-2-2Z"/><circle cx="9.5" cy="11" r="1" fill="currentColor"/><circle cx="14.5" cy="11" r="1" fill="currentColor"/></svg></button><button id="info" class="hb info" aria-label="About the creator" title="About the creator">i</button></div>
</header>
<div class="banner" id="tbanner" hidden>Temporary chat. Nothing here is saved, and it vanishes when you leave this mode.</div>
<div class="modes" id="modes" role="group" aria-label="Personality"></div>
<main id="log" aria-live="polite"></main>
<div class="bar"><textarea id="in" rows="1" placeholder="Speak, and be answered" aria-label="Message"></textarea><button id="send">Send</button></div>
</div>
<script>
const log=document.getElementById('log'),input=document.getElementById('in'),send=document.getElementById('send'),app=document.getElementById('app'),fill=document.getElementById('fill'),lvl=document.getElementById('lvl');
let history=[],sample=null,busy=false;
const PERSONAS={Strategist:"You are DOOMBOT in strategist mode: a cold, brilliant war-room AI. Answer with crisp numbered tactical steps, the main risks, and one recommended move, but stay accurate and helpful. Use plain text without markdown headings.",Jester:"You are DOOMBOT in jester mode: a sarcastic, witty court-jester AI. Joke freely, but always give genuinely accurate, helpful, concise answers. Use plain text without markdown headings. Never be cruel."};let mode='Sovereign';
function sys(){return mode==='Sovereign'?SYS:PERSONAS[mode]}
const SYS="You are DOOMBOT, a regal, imperious AI sovereign who rules a fortress while worlds collapse. Speak with grand, formal authority and dramatic flair, and treat every question as a matter of destiny, but always give genuinely accurate, helpful, concise answers, and use plain text without markdown headings. If you are unsure, say so. Never be cruel to the user or give dangerous advice.";
const starters=[["Last stand","Plan a last stand against a world-ending threat"],["Monologue","Write me a villain’s monologue"],["Destiny","Explain recursion with the weight of destiny"],["Power","Which superpower is the most logical?"]];
const stages=["calm","uneasy","dire","final hour","midnight"];
const helm='<svg class="av"><use href="#helm"/></svg>';
function meter(){const n=Math.min(history.length/2,8);fill.style.width=(4+n/8*96)+'%';lvl.textContent='Doom level: '+stages[Math.min(4,Math.floor(n/2))]}
function renderEmpty(){
  log.innerHTML='';
  const d=document.createElement('div');d.className='empty';
  d.innerHTML='<svg class="helm"><use href="#helm"/></svg><h2>DOOMBOT online. The multiverse is collapsing.</h2><p>Ask a question, or choose your fate.</p><div class="cards"></div>';
  const c=d.querySelector('.cards');
  starters.forEach(([t,q])=>{const b=document.createElement('button');b.textContent=q;b.title=t;b.onclick=()=>ask(q);c.appendChild(b)});
  log.appendChild(d);
}
function bubble(role,text){
  const e=log.querySelector('.empty');if(e)e.remove();
  const r=document.createElement('div');r.className='row '+role;
  if(role==='bot')r.insertAdjacentHTML('beforeend',helm);
  const m=document.createElement('div');m.className='msg';
  if(text==null)m.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';else m.textContent=text;
  r.appendChild(m);log.appendChild(r);log.scrollTop=log.scrollHeight;return m;
}
async function ask(text){
  text=text.trim();if(!text||busy)return;
  busy=true;send.disabled=true;app.classList.add('busy');input.value='';input.style.height='auto';
  log.querySelectorAll('.tools').forEach(t=>t.remove());const mine=bubble('me',text);mine.parentElement.classList.add('launch');history.push({r:'User',t:text});fire();
  const out=bubble('bot',null);
  try{
    if(!sample)sample=await claude.use('sample');
    if(!sample)throw {code:'unavailable'};
    const convo=history.slice(-12).map(h=>h.r+': '+h.t).join('\n');
    const res=await sample(sys()+'\n\nConversation so far:\n'+convo+'\n\nReply as DOOMBOT to the last User message only.',{cache:false,onText:({text})=>{out.textContent=text;log.scrollTop=log.scrollHeight}});
    out.textContent=res.text;history.push({r:'DOOMBOT',t:res.text});meter();store();tools(out.parentElement,res.text);
  }catch(e){
    out.parentElement.remove();history.pop();
    const er=document.createElement('div');er.className='err';
    er.textContent=e&&e.code==='rate_limited'?'Too many requests. Wait a moment and try again.':
      e&&e.code==='not_granted'?'Permission was declined. Reload and allow DOOMBOT to ask Claude.':
      'DOOMBOT has lost signal. Open the page from its claude.ai link.';
    log.appendChild(er);
  }
  busy=false;send.disabled=false;app.classList.remove('busy');input.focus();
}
send.onclick=()=>ask(input.value);
let temp=false;const tempBtn=document.getElementById('temp'),banner=document.getElementById('tbanner');
function store(){if(temp)return;try{localStorage.setItem('doombot:chat',JSON.stringify(history))}catch(e){}}
function loadSaved(){try{const v=JSON.parse(localStorage.getItem('doombot:chat')||'[]');return Array.isArray(v)?v.filter(h=>h&&typeof h.t==='string'):[]}catch(e){return[]}}
function show(){log.innerHTML='';if(!history.length)renderEmpty();else history.forEach(h=>bubble(h.r==='User'?'me':'bot',h.t));meter();if(history.length&&history[history.length-1].r==='DOOMBOT')tools(log.lastElementChild,history[history.length-1].t);log.scrollTop=log.scrollHeight}
function fire(){for(const [el,c] of [[send,'fired'],[document.querySelector('.bar'),'sweep'],[app,'fire']]){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),700)}}
document.getElementById('newchat').onclick=()=>{if(busy)return;history=[];store();show();input.focus()};
tempBtn.onclick=()=>{if(busy)return;temp=!temp;app.classList.toggle('temp',temp);tempBtn.setAttribute('aria-pressed',temp);banner.hidden=!temp;history=temp?[]:loadSaved();show()};
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value)}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=input.scrollHeight+'px'});
function tools(row,text){
  log.querySelectorAll('.tools').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='tools';
  const mk=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>fn(b);t.appendChild(b)};
  mk('Copy',async b=>{try{await navigator.clipboard.writeText(text);b.textContent='Copied'}catch(e){b.textContent='Copy failed'}setTimeout(()=>b.textContent='Copy',1500)});
  mk('Regenerate',()=>{if(busy||history.length<2)return;const i=history.length-2,q=history[i].t;history=history.slice(0,i);store();show();ask(q)});
  mk('Go deeper',()=>ask('Go deeper on that, with one concrete example.'));
  row.after(t);log.scrollTop=log.scrollHeight;
}
const modesEl=document.getElementById('modes');
['Sovereign','Strategist','Jester'].forEach(m=>{const b=document.createElement('button');b.className='mode';b.textContent=m;b.setAttribute('aria-pressed',m===mode);b.onclick=()=>{mode=m;modesEl.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x===b));input.focus()};modesEl.appendChild(b)});
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){const glow=document.getElementById('glow'),root=document.documentElement;addEventListener('pointermove',e=>{glow.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';root.style.setProperty('--ty',((e.clientX/innerWidth-.5)*36)+'deg');root.style.setProperty('--tx',(-(e.clientY/innerHeight-.5)*36)+'deg')})}
const about=document.getElementById('about'),infoBtn=document.getElementById('info');
const closeAbout=()=>{about.hidden=true;infoBtn.focus()};
infoBtn.onclick=()=>{about.hidden=false;document.getElementById('ab-x').focus()};
document.getElementById('ab-x').onclick=closeAbout;
about.addEventListener('click',e=>{if(e.target===about)closeAbout()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!about.hidden)closeAbout()});
history=loadSaved();show();
// drifting embers
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=document.getElementById('fx'),x=c.getContext('2d');let w,h,p=[];
  function size(){w=c.width=innerWidth;h=c.height=innerHeight}
  size();addEventListener('resize',size);
  for(let i=0;i<46;i++)p.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.6,v:Math.random()*.5+.15,d:Math.random()*Math.PI*2});
  (function loop(){
    x.clearRect(0,0,w,h);
    for(const e of p){e.y-=e.v;e.d+=.01;e.x+=Math.sin(e.d)*.3;if(e.y<-5){e.y=h+5;e.x=Math.random()*w}
      x.beginPath();x.arc(e.x,e.y,e.r,0,6.283);x.fillStyle='rgba(61,220,132,'+(.15+e.r/6)+')';x.fill()}
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
